version: '3.8'

x-spark-common: &spark-common
  image: apache/spark:3.5.0
  command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
  volumes:
    - ./spark/apps/qttg:/opt/spark/apps/qttg:ro
    - ./output/raw_qttg_1m:/opt/spark/data/raw_qttg_1m:ro
    - ./output/spark_lake:/opt/spark/data/lake
  networks:
    - spark-net

x-airflow-common: &airflow-common
  build:
    context: ./airflow-local
  image: qttg-airflow:2.8.1
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: local-qTTg-demo-only
  volumes:
    - ./airflow-local/dags:/opt/airflow/dags
    - ./airflow-local/logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  networks:
    - spark-net
  depends_on:
    postgres:
      condition: service_healthy

services:
  # --- SPARK SERVICES ---
  spark-master:
    <<: *spark-common
    container_name: tst-spark-master
    ports:
      - "8088:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master

  spark-worker:
    <<: *spark-common
    container_name: tst-spark-worker
    ports:
      - "8081:8081"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master

  # --- AIRFLOW SERVICES ---
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - spark-net

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users create \
          --username admin \
          --password admin \
          --firstname Local \
          --lastname Admin \
          --role Admin \
          --email admin@example.local || echo "User admin da ton tai")

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

networks:
  spark-net:
    driver: bridge

volumes:
  airflow-postgres:
